<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Приглашение</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1b1b1b, #0a0a0a);
      font-family: 'Cormorant Garamond', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .envelope {
      width: 320px;
      height: 220px;
      background: linear-gradient(145deg, #2a2a2a, #141414);
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.7);
      transition: transform 0.4s ease;
    }

    .envelope:hover {
      transform: scale(1.05);
    }

    .seal {
      width: 75px;
      height: 75px;
      background: radial-gradient(circle, #8b1e2d, #4a0c14);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      color: #fff;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.6);
      transition: transform 0.6s ease, opacity 0.6s ease;
    }

    .seal.break {
      transform: scale(1.4) rotate(20deg);
      opacity: 0;
    }

    .scroll {
      position: absolute;
      top: 50%;
      transform: translateY(-50%) scaleY(0);
      transform-origin: top;
      width: 92vw;
      max-width: 650px;
      height: 85vh;
      background: #f3eadf;
      border-radius: 14px;
      padding: 35px;
      overflow-y: auto;
      transition: transform 1.2s ease;
      box-shadow: 0 30px 80px rgba(0,0,0,0.8);
      border: 1px solid rgba(0,0,0,0.1);
    }

    .scroll.open {
      transform: translateY(-50%) scaleY(1);
    }

    h1 {
      text-align: center;
      font-family: 'Great Vibes', cursive;
      font-size: 48px;
      margin-bottom: 5px;
      color: #5a0f1a;
    }

    h2 {
      margin-top: 25px;
      color: #3a3a3a;
    }

    .section {
      margin-bottom: 25px;
    }

    .guest-name {
      text-align: center;
      font-size: 18px;
      margin-bottom: 15px;
      color: #555;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: inherit;
    }

    button {
      background: #7a1f2b;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    button:hover {
      background: #4f121a;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      font-size: 14px;
      color: #777;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 1s forwards;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>
<body>

<div class="envelope" onclick="openLetter()">
  <div class="seal" id="seal">💍</div>
</div>

<div class="scroll" id="scroll">
  <h1 class="fade-in">Our Wedding</h1>
  <div class="guest-name fade-in" id="guestName"></div>

  <div class="section fade-in">
    <p>Мы приглашаем вас разделить с нами этот день</p>
    <p><b>Дата:</b> 07.07.2027</p>
    <p><b>Место:</b> у озера</p>
  </div>

  <div class="section fade-in">
    <h2>Дресс-код</h2>
    <p>Бордовый, темно-зеленый, айвори. Лёгкая романтика, природные ткани.</p>
  </div>

  <div class="section fade-in">
    <h2>Опрос</h2>

    <form action="https://formsubmit.co/YOUR_EMAIL@example.com" method="POST">
      <input type="hidden" name="_captcha" value="false">

      <label>Ваше имя</label>
      <input type="text" name="name" required>

      <label>Алкоголь</label>
      <input type="text" name="alcohol">

      <label>Аллергии</label>
      <input type="text" name="allergy">

      <label>Любимая песня</label>
      <input type="text" name="song">

      <label>Придете?</label>
      <select name="attendance">
        <option>Да</option>
        <option>Нет</option>
      </select>

      <button type="submit">Отправить</button>
    </form>
  </div>

  <div class="footer">С любовью ❤️</div>
</div>

<script>
  function openLetter() {
    const seal = document.getElementById('seal');
    const scroll = document.getElementById('scroll');

    seal.classList.add('break');

    setTimeout(() => {
      scroll.classList.add('open');
    }, 400);
  }

  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  if (name) {
    document.getElementById('guestName').innerText = name + ', это приглашение для тебя';
  }
</script>

</body>
</html>
