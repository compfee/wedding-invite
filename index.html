<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Приглашение</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500&family=Great+Vibes&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: radial-gradient(circle at top, #1f1f1f, #0f0f0f);
      font-family: 'Cormorant Garamond', serif;
      color: #2b2b2b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .envelope {
      width: 320px;
      height: 220px;
      background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
      border-radius: 12px;
      position: relative;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      transition: transform 0.3s;
    }

    .envelope:hover {
      transform: scale(1.03);
    }

    .seal {
      width: 70px;
      height: 70px;
      background: radial-gradient(circle, #8b1e2d, #5a0f1a);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      color: #fff;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.5);
    }

    .scroll {
      position: absolute;
      top: 50%;
      transform: translateY(-50%) scaleY(0);
      width: 92vw;
      max-width: 650px;
      height: 85vh;
      background: #f5efe6;
      border-radius: 12px;
      padding: 30px;
      overflow-y: auto;
      transition: transform 1s ease;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }

    .scroll.open {
      transform: translateY(-50%) scaleY(1);
    }

    h1 {
      text-align: center;
      font-family: 'Great Vibes', cursive;
      font-size: 42px;
      margin-bottom: 10px;
    }

    h2 {
      margin-top: 25px;
    }

    .section {
      margin-bottom: 25px;
    }

    .guest-name {
      text-align: center;
      font-size: 18px;
      margin-bottom: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid #ccc;
      font-family: inherit;
    }

    button {
      background: #7a1f2b;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #5e1620;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="envelope" onclick="openScroll()">
  <div class="seal">💍</div>
</div>

<div class="scroll" id="scroll">
  <h1>Our Wedding</h1>
  <div class="guest-name" id="guestName"></div>

  <div class="section">
    <p>Мы приглашаем вас разделить с нами этот день</p>
    <p><b>Дата:</b> 07.07.2027</p>
    <p><b>Место:</b> у озера</p>
  </div>

  <div class="section">
    <h2>Дресс-код</h2>
    <p>Бордовый, темно-зеленый, айвори. Лёгкая романтика, природные ткани.</p>
  </div>

  <div class="section">
    <h2>Опрос</h2>

    <form action="https://formsubmit.co/somn117@yandex.ru" method="POST">
      <input type="hidden" name="_captcha" value="false">

      <label>Ваше имя</label>
      <input type="text" name="name" required>

      <label>Алкоголь</label>
      <input type="text" name="alcohol">

      <label>Аллергии</label>
      <input type="text" name="allergy">

      <label>Любимая песня</label>
      <input type="text" name="song">

      <label>Придете?</label>
      <select name="attendance">
        <option>Да</option>
        <option>Нет</option>
      </select>

      <button type="submit">Отправить</button>
    </form>
  </div>

  <div class="footer">С любовью ❤️</div>
</div>

<script>
  function openScroll() {
    document.getElementById('scroll').classList.add('open');
  }

  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  if (name) {
    document.getElementById('guestName').innerText = name + ', это приглашение для тебя';
  }
</script>

</body>
</html>
